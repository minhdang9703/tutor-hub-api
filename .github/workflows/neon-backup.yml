name: Neon PostgreSQL Backup

on:
  workflow_dispatch:

  schedule:
    - cron: "0 19 * * *" # 02:00 VN (UTC+7)

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Backup Neon database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p backups

          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          FILE="backups/tutor_hub_${TIMESTAMP}.backup"

          pg_dump \
            --dbname="$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="$FILE"

          test -s "$FILE"

          pg_restore --list "$FILE" > /dev/null

          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 7
          if-no-files-found: error
