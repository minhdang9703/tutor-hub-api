spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: tutor-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tutorhub}
    username: ${DB_USERNAME:tutorhub}
    password: ${DB_PASSWORD:tutorhub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:tutorhub}
  booking:
    cancellation-minutes: ${BOOKING_CANCELLATION_MINUTES:360}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
